# =============================================================================
# Podman containers.conf - SelfHost Server (aevion)
# =============================================================================
#
# This file sets system-wide defaults for all Podman containers run by the
# `legion` user on aevion.
#
# Install location on server:
#   ~/.config/containers/containers.conf
#
# Deploy with:
#   mkdir -p ~/.config/containers
#   scp podman/containers.conf legion@aevion:~/.config/containers/containers.conf
#
# Per-container `--dns` flags in podman-setup.sh scripts override these
# defaults (with the `CONTAINERS_CONF=/dev/null` quirk-workaround — see
# `.cursor/rules/podman-dns-bypass.mdc`).
#
# Reference: https://github.com/containers/common/blob/main/docs/containers.conf.5.md
# See also:  docs/DNS_ARCHITECTURE.md in this repo
# =============================================================================


# ─── Network: pasta tuning ────────────────────────────────────────────────────
#
# Podman launches pasta with a fixed set of defaults for every container
# (visible via `ps -o args -C pasta`). The relevant defaults are:
#
#   --dns-forward 169.254.1.1   # in-namespace DNS sink address
#   --map-guest-addr 169.254.1.2 # how the host reaches back into the namespace
#   --no-map-gw                  # do NOT translate gateway-IP traffic to host
#                                # (so the gateway IP is just the gateway IP)
#
# Podman picked `169.254.1.1` because it's an IPv4 link-local address
# (RFC 3927, the 169.254.0.0/16 range). Link-local addresses are reserved by
# the IANA for "this segment only" use — they're never routed and never
# assigned to real hosts — so binding a special meaning to one inside the
# container's namespace is guaranteed not to collide with anything on the
# user's actual LAN. (This is the same range AWS uses for its instance
# metadata service at 169.254.169.254 for the same reason.)
#
# Source for the choice: containers/common, libnetwork/pasta/pasta_linux.go
#   "given this is a 'link local' ip it should be very unlikely that
#    it causes conflicts."
#
# What `--dns-forward 169.254.1.1` actually does:
#   pasta listens (in-namespace, transparently) for UDP/TCP packets to
#   169.254.1.1:53. When it sees one, it forwards the query to the address
#   given by `--dns-host` (default: first `nameserver` line from the host's
#   /etc/resolv.conf), then writes the answer back into the namespace.
#   It is a DNS-port intercept — port 53 only — and does NOT expose any
#   other host loopback ports. Important: this is fundamentally different
#   from `--map-host-loopback`, which is an *all-port* loopback bridge.
#
# Why we override `--dns-host` here:
#   On aevion, the host's /etc/resolv.conf is owned by Tailscale and points
#   at `100.100.100.100` (MagicDNS). Without this override, every container's
#   DNS path is:
#       container → pasta@169.254.1.1 → host's resolver (100.100.100.100)
#                  → tailscaled → MagicDNS → AGH (100.64.10.1 self-loop)
#                  → AGH container → answer back through the chain
#   That self-loop adds ~1–1.5s of cold-query latency and makes container
#   DNS depend on `tailscaled` being healthy.
#
#   Setting `--dns-host 192.168.1.105` short-circuits Tailscale: pasta
#   forwards DNS straight to AGH on aevion's LAN IP. The host's own
#   resolv.conf is untouched (Tailscale MagicDNS keeps working for the
#   host itself, e.g. `ssh aevion`).
#
# This works for ALL pasta containers — both default pasta and pasta with
# `--map-host-loopback,10.0.2.2`. It does NOT work for slirp4netns
# (no equivalent intercept), which is why the whole stack has been migrated
# to pasta. Only `node-exporter` is an exception — it uses `--network host`
# so it can read host-level metrics. See
# `docs/SLIRP4NETNS_TO_PASTA_MIGRATION.md` for migration history.
[network]
pasta_options = ["--dns-host", "192.168.1.105"]


# ─── DNS ──────────────────────────────────────────────────────────────────────
#
# Tell every container to query `169.254.1.1`. That hits pasta's DNS-forward
# intercept (above) and is forwarded to AGH at 192.168.1.105. End-to-end
# path becomes:
#       container → pasta@169.254.1.1 → AGH@192.168.1.105 → answer
#
# Why NOT 192.168.1.105 here directly?
#   pasta copies the host's IP addresses into every container's namespace
#   (so the container has 192.168.1.105 on its `enP4p65s0` interface and
#   `ip route get 192.168.1.105` says "dev lo"). But that `lo` is the
#   *container's own* loopback, not the host's. So a packet to
#   192.168.1.105:53 from inside a pasta container never leaves the
#   container — it stays in the container's lo, where nothing is listening
#   on port 53, and the query times out (this is exactly what broke
#   Prowlarr/Radarr in the previous iteration of this file).
#   Use 169.254.1.1 instead — it isn't in the namespace's routing table as
#   a local IP, so the packet reaches pasta and pasta forwards it for us.
#
# Why NOT 127.0.0.1 here?
#   Same reason — 127.0.0.1 from inside the container is the container's
#   own loopback, not the host's.
#
# Why NOT 10.0.2.2 here (i.e. "Option A" from past planning)?
#   That requires `--map-host-loopback,10.0.2.2` on every container, which
#   would expose ALL host loopback ports — not just DNS — to ~27 containers
#   that don't currently have any host-loopback access at all. See
#   `docs/HOST_LOOPBACK_SECURITY.md` and `.cursor/rules/security-practices.mdc`.
#   The 169.254.1.1 / `--dns-host` route gives us the same DNS speed without
#   that broad new exposure.
#
# Per-container overrides (in their podman-setup.sh, paired with the
# `CONTAINERS_CONF=/dev/null` workaround for Podman 5.x's `--dns` append
# quirk — see `.cursor/rules/podman-dns-bypass.mdc`):
#   - qbittorrent: `--dns 1.1.1.1 --dns 9.9.9.9` (bypasses AGH so tracker
#     hosts aren't sinkholed by StevenBlack Extra / SafeBrowsing lists).
#   - adguardhome:  `--dns 1.1.1.1` (avoids self-reference during bootstrap
#     when AGH is itself starting up).
[containers]
dns_servers = ["169.254.1.1"]

# Note: dns_searches and dns_options intentionally left at defaults.
# `*.aevion.lan` resolution is handled by AGH rewrite rules, not search
# domains.
