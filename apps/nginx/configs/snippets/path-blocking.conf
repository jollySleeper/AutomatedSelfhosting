# ===== PATH BLOCKING =====
# Block access to sensitive or potentially dangerous paths

# Block hidden files and directories (starting with .)
# Prevents access to .git, .env, .htaccess, etc.
# access_log off and log_not_found off reduce log noise for these requests
location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
}

# Block common administrative/control panel paths
# These paths are commonly targeted by attackers looking for vulnerable software
# wp-admin/wp-login: WordPress admin areas
# admin/administrator/login: Generic admin panels
# cpanel/plesk: Hosting control panels
# phpmyadmin/pma: Database admin tools
# webmail/roundcube/squirrelmail/horde/imp: Email clients
location ~ /(wp-admin|wp-login|admin|administrator|login|cpanel|plesk|phpmyadmin|pma|webmail|roundcube|squirrelmail|horde|imp) {
    deny all;
    access_log /tmp/security.log main;
    return 444;
}

# Block executable/script file extensions
# Since this server only serves a 404 page, executable files should never be requested
# This blocks attempts to execute scripts or download malware
# .* matches case-insensitive extensions
location ~* \.(php|asp|jsp|py|cgi|pl|exe|bat|cmd|com)$ {
    deny all;
    access_log /tmp/security.log main;
    return 444;
}
