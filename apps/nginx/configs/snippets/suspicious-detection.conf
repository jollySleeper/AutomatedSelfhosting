# ===== SUSPICIOUS REQUEST DETECTION =====
# Detects and blocks common attack patterns

# Initialize suspicious flag to 0 (not suspicious)
set $suspicious 0;

# Path traversal attacks: ../../../ or encoded variants
# Detects attempts to access files outside the web root
if ($request_uri ~* "(?:\.\./|\.\.\\|%2e%2e|%2e%5c|%5c%2e)") { set $suspicious 1; }

# XSS attempts: HTML/script injection in URLs
# Detects attempts to inject malicious HTML/JavaScript
if ($request_uri ~* "(?:<|>|script|iframe|object|embed)") { set $suspicious 1; }

# Malicious user agents: Common security scanning tools
# Detects automated vulnerability scanners and attack tools
if ($http_user_agent ~* "(?:sqlmap|nikto|nmap|masscan|dirbuster|gobuster|acunetix|openvas)") { set $suspicious 1; }

# ===== SECURITY LOGGING =====
# Log suspicious requests to a separate security log file
# Only logs when suspicious=1, keeping regular access logs clean
access_log /tmp/security.log main if=$suspicious;

# ===== BLOCK SUSPICIOUS REQUESTS =====
# Immediately close connection (444) for suspicious requests
# 444 means "No Response" - connection closed without sending data
# This gives attackers no information and wastes their resources
if ($suspicious = 1) {
    return 444;
}
