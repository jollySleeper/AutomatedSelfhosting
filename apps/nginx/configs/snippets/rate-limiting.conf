# ===== RATE LIMITING (OPTIONAL) =====
# Rate limiting requires zones to be defined in the http block of nginx.conf
# To enable: Add these lines to the http { } block in nginx.conf:
# limit_req_zone $binary_remote_addr zone=default:10m rate=5r/s;
# limit_req_zone $binary_remote_addr zone=aggressive:10m rate=1r/s;
# Then uncomment these lines in the server block:
# limit_req zone=default burst=10 nodelay;
# limit_req zone=aggressive burst=5 nodelay;
#
# This would limit requests to 5 per second per IP with burst allowance,
# and aggressive scanning tools to 1 per second.
