# ===== REQUEST LIMITS AND TIMEOUTS =====
# Prevents abuse and limits resource consumption

# client_max_body_size: Limit request body size to 1KB
# Prevents large POST requests that could be used for DoS or buffer overflow attacks
# Since this is a 404 handler, legitimate requests should be very small
client_max_body_size 1k;

# client_body_timeout: 10 seconds to receive request body
# Prevents slowloris-style attacks that send data very slowly
client_body_timeout 10s;

# client_header_timeout: 10 seconds to receive request headers
# Prevents clients from holding connections open indefinitely
client_header_timeout 10s;

# keepalive_timeout: Close keep-alive connections after 5 seconds of inactivity
# Reduces resource usage and prevents connection exhaustion attacks
keepalive_timeout 5s;

# send_timeout: 10 seconds timeout for transmitting response
# Prevents connections from hanging during response transmission
send_timeout 10s;
