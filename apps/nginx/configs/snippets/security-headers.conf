# ===== SECURITY HEADERS =====
# Comprehensive security headers to protect against various web vulnerabilities

# X-Frame-Options: DENY - Prevents clickjacking attacks by denying iframe embedding
# Protects against malicious sites embedding your content in frames
add_header X-Frame-Options "DENY" always;

# X-Content-Type-Options: nosniff - Prevents MIME type sniffing attacks
# Forces browser to respect declared content-type, preventing XSS via file uploads
add_header X-Content-Type-Options "nosniff" always;

# X-XSS-Protection: Enables browser's built-in XSS filtering and blocks suspicious content
# Additional layer of protection against reflected XSS attacks
add_header X-XSS-Protection "1; mode=block" always;

# Referrer-Policy: Controls what referrer information is sent with requests
# strict-origin-when-cross-origin balances privacy and functionality
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Content-Security-Policy: Restrictive CSP that only allows necessary resources for the 404 page
# default-src 'none': Block everything by default
# script-src/style-src 'unsafe-inline': Allow inline CSS/JS for the custom 404 page
# img-src 'self' data:: Allow images from same origin and data URIs
# Everything else blocked to prevent malicious resource loading
add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; media-src 'none'; object-src 'none'; child-src 'none'; worker-src 'none'; frame-ancestors 'none';" always;

# Permissions-Policy: Disables all modern browser permissions/features
# Prevents malicious sites from accessing device features like camera, microphone, location, etc.
# Empty parentheses () deny all permissions for each feature
add_header Permissions-Policy "accelerometer=(), ambient-light-sensor=(), autoplay=(), battery=(), bluetooth=(), browsing-topics=(), camera=(), display-capture=(), document-domain=(), encrypted-media=(), execution-while-not-rendered=(), execution-while-out-of-viewport=(), fullscreen=(), gamepad=(), geolocation=(), gyroscope=(), hid=(), identity-credentials-get=(), idle-detection=(), local-fonts=(), magnetometer=(), microphone=(), midi=(), otp-credentials=(), payment=(), picture-in-picture=(), publickey-credentials-create=(), publickey-credentials-get=(), screen-wake-lock=(), serial=(), speaker-selection=(), storage-access=(), usb=(), web-share=(), window-management=(), xr-spatial-tracking=()" always;

# Cross-Origin-Embedder-Policy: require-corp - Requires explicit opt-in for cross-origin embedding
# Prevents certain cross-origin attacks and enforces resource sharing policies
add_header Cross-Origin-Embedder-Policy "require-corp" always;

# Cross-Origin-Opener-Policy: same-origin - Isolates the browsing context to same-origin documents
# Protects against certain cross-origin attacks and side-channel attacks
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Cross-Origin-Resource-Policy: same-origin - Restricts cross-origin resource access
# Prevents other sites from embedding your resources without permission
add_header Cross-Origin-Resource-Policy "same-origin" always;
