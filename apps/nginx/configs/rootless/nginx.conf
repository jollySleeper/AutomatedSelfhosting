# Copied From Container Image:
# https://hub.docker.com/r/nginxinc/nginx-unprivileged
# Check The Overview Section
# NOTE: Using The Library Image Instead of Above Image

worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /tmp/nginx.pid;


events {
    worker_connections  1024;
}


http {
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Hide the nginx version in Server headers and default error pages
    # so responses (incl. the default 404) leak no version info to scanners.
    server_tokens off;

    # WebSocket connection upgrade handling (used by proxy-defaults.conf)
    # - WebSocket requests ($http_upgrade set): Connection = "upgrade"
    # - Normal HTTP requests ($http_upgrade empty): Connection = "close"
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    include /etc/nginx/conf.d/*.conf;
}
