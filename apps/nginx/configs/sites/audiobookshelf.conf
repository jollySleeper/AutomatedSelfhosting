# Audiobookshelf - Audiobook and Podcast Server
# Based on official documentation:
# https://github.com/advplyr/audiobookshelf#nginx-reverse-proxy
#
# Key settings:
# - proxy_buffering on: Upstream is localhost (fast), client is Wi-Fi (variable).
#   Buffering decouples speeds and prevents TCP backpressure stalls during
#   audiobook streaming. Temp files go to tmpfs (RAM) — no SSD wear.
# - WebSocket support: Required for real-time playback sync
# - Range headers: Enable seeking in audiobooks (jump to chapter/timestamp)
# - Large client_max_body_size: Allow audiobook uploads

server {
    listen 1080;
    server_name abs.aevion.lan audiobookshelf.aevion.lan;

    set $UPSTREAM_IP 10.0.2.2;
    set $UPSTREAM_PORT 8042;

    client_max_body_size 0;

    location / {
        proxy_pass http://$UPSTREAM_IP:$UPSTREAM_PORT;
        include /etc/nginx/snippets/proxy-defaults.conf;

        proxy_buffering on;
        proxy_buffers 32 16k;
        proxy_buffer_size 16k;
        proxy_busy_buffers_size 256k;
        proxy_max_temp_file_size 128m;
        proxy_temp_file_write_size 256k;

        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
    }

    location /socket.io/ {
        proxy_pass http://$UPSTREAM_IP:$UPSTREAM_PORT;
        include /etc/nginx/snippets/proxy-defaults.conf;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}

server {
    listen 1443 ssl;
    http2 on;
    server_name abs.aevion.lan audiobookshelf.aevion.lan;

    set $UPSTREAM_IP 10.0.2.2;
    set $UPSTREAM_PORT 8042;

    client_max_body_size 0;

    include /etc/nginx/snippets/self-signed.conf;
    include /etc/nginx/snippets/ssl-params.conf;

    location / {
        proxy_pass http://$UPSTREAM_IP:$UPSTREAM_PORT;
        include /etc/nginx/snippets/proxy-defaults.conf;

        proxy_buffering on;
        proxy_buffers 32 16k;
        proxy_buffer_size 16k;
        proxy_busy_buffers_size 256k;
        proxy_max_temp_file_size 128m;
        proxy_temp_file_write_size 256k;

        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
    }

    location /socket.io/ {
        proxy_pass http://$UPSTREAM_IP:$UPSTREAM_PORT;
        include /etc/nginx/snippets/proxy-defaults.conf;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
