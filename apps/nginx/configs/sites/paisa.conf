# Paisa — Personal Finance Manager
# https://paisa.fyi/
#
# proxy_buffering off: Lightweight web app with chart rendering.

server {
    listen 1080;
    server_name paisa.aevion.lan;

    set $UPSTREAM_IP 10.0.2.2;
    set $UPSTREAM_PORT 8057;

    location / {
        proxy_pass http://$UPSTREAM_IP:$UPSTREAM_PORT;
        include /etc/nginx/snippets/proxy-defaults.conf;
        proxy_buffering off;
    }
}

server {
    listen 1443 ssl;
    http2 on;
    server_name paisa.aevion.lan;

    set $UPSTREAM_IP 10.0.2.2;
    set $UPSTREAM_PORT 8057;

    include /etc/nginx/snippets/self-signed.conf;
    include /etc/nginx/snippets/ssl-params.conf;

    location / {
        proxy_pass http://$UPSTREAM_IP:$UPSTREAM_PORT;
        include /etc/nginx/snippets/proxy-defaults.conf;
        proxy_buffering off;
    }
}
