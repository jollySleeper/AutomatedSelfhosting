# Navidrome - Music Streaming Server
# https://www.navidrome.org/docs/
#
# Key settings:
# - proxy_buffering on: Upstream is localhost (fast), client is Wi-Fi (variable).
#   Buffering decouples speeds and prevents TCP backpressure stalls during
#   music streaming. Temp files go to tmpfs (RAM) — no SSD wear.
# - Range headers: Enable seeking in tracks (jump to specific time)

server {
    listen 1080;
    server_name navi.aevion.lan navidrome.aevion.lan;

    set $UPSTREAM_IP 10.0.2.2;
    set $UPSTREAM_PORT 8043;

    location / {
        proxy_pass http://$UPSTREAM_IP:$UPSTREAM_PORT;
        include /etc/nginx/snippets/proxy-defaults.conf;

        proxy_buffering on;
        proxy_buffers 32 16k;
        proxy_buffer_size 16k;
        proxy_busy_buffers_size 256k;
        proxy_max_temp_file_size 64m;
        proxy_temp_file_write_size 256k;

        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
    }
}

server {
    listen 1443 ssl;
    http2 on;
    server_name navi.aevion.lan navidrome.aevion.lan;

    set $UPSTREAM_IP 10.0.2.2;
    set $UPSTREAM_PORT 8043;

    include /etc/nginx/snippets/self-signed.conf;
    include /etc/nginx/snippets/ssl-params.conf;

    location / {
        proxy_pass http://$UPSTREAM_IP:$UPSTREAM_PORT;
        include /etc/nginx/snippets/proxy-defaults.conf;

        proxy_buffering on;
        proxy_buffers 32 16k;
        proxy_buffer_size 16k;
        proxy_busy_buffers_size 256k;
        proxy_max_temp_file_size 64m;
        proxy_temp_file_write_size 256k;

        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
    }
}
