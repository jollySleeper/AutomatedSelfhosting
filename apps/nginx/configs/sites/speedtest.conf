# Speedtest Tracker — network speed monitoring
#
# Canonical config for the speedtest service. Serves both hostnames
# (speedtest.aevion.lan and the short st.aevion.lan). This replaced the old
# st.conf, which duplicated speedtest.aevion.lan and caused a conflicting
# server_name warning.
server {
    listen 1080;
    server_name speedtest.aevion.lan st.aevion.lan;

    set $UPSTREAM_IP 10.0.2.2;
    set $UPSTREAM_PORT 8054;

    include /etc/nginx/snippets/proxy-defaults.conf;

    location / {
        proxy_pass http://$UPSTREAM_IP:$UPSTREAM_PORT;
    }
}
