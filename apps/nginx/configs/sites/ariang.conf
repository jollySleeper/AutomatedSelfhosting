# AriaNg - aria2 Web UI
# https://github.com/mayswind/AriaNg
#
# AriaNg is a 100% static web app. The aria2 RPC connection is made FROM THE
# BROWSER (not from the AriaNg container), so we must expose the aria2 RPC
# through nginx on the same origin as AriaNg to avoid CORS and reachability
# issues. The /jsonrpc location proxies to aria2's RPC daemon on 127.0.0.1:8062.
# proxy-defaults.conf already handles WebSocket upgrades via $connection_upgrade.
#
# proxy_buffering off: Static web UI with small responses.

server {
    listen 1080;
    server_name ariang.aevion.lan;

    set $UPSTREAM_IP 10.0.2.2;
    set $ARIANG_PORT 8063;
    set $ARIA2_RPC_PORT 8062;

    location = /jsonrpc {
        proxy_pass http://$UPSTREAM_IP:$ARIA2_RPC_PORT/jsonrpc;
        include /etc/nginx/snippets/proxy-defaults.conf;

        proxy_buffering off;
    }

    location / {
        proxy_pass http://$UPSTREAM_IP:$ARIANG_PORT;
        include /etc/nginx/snippets/proxy-defaults.conf;

        proxy_buffering off;
    }
}

server {
    listen 1443 ssl;
    http2 on;
    server_name ariang.aevion.lan;

    set $UPSTREAM_IP 10.0.2.2;
    set $ARIANG_PORT 8063;
    set $ARIA2_RPC_PORT 8062;

    include /etc/nginx/snippets/self-signed.conf;
    include /etc/nginx/snippets/ssl-params.conf;

    location = /jsonrpc {
        proxy_pass http://$UPSTREAM_IP:$ARIA2_RPC_PORT/jsonrpc;
        include /etc/nginx/snippets/proxy-defaults.conf;

        proxy_buffering off;
    }

    location / {
        proxy_pass http://$UPSTREAM_IP:$ARIANG_PORT;
        include /etc/nginx/snippets/proxy-defaults.conf;

        proxy_buffering off;
    }
}
