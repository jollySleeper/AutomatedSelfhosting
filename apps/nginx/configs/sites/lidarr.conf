# Lidarr - Music Management
# https://wiki.servarr.com/lidarr
#
# proxy_buffering off: API/management service with small JSON responses.

server {
    listen 1080;
    server_name lidarr.aevion.lan;

    set $UPSTREAM_IP 10.0.2.2;
    set $UPSTREAM_PORT 8066;

    location / {
        proxy_pass http://$UPSTREAM_IP:$UPSTREAM_PORT;
        include /etc/nginx/snippets/proxy-defaults.conf;

        proxy_buffering off;
    }
}

server {
    listen 1443 ssl;
    http2 on;
    server_name lidarr.aevion.lan;

    set $UPSTREAM_IP 10.0.2.2;
    set $UPSTREAM_PORT 8066;

    include /etc/nginx/snippets/self-signed.conf;
    include /etc/nginx/snippets/ssl-params.conf;

    location / {
        proxy_pass http://$UPSTREAM_IP:$UPSTREAM_PORT;
        include /etc/nginx/snippets/proxy-defaults.conf;

        proxy_buffering off;
    }
}
