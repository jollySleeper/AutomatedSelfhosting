# wger Configuration - Based on official docker setup
# https://github.com/wger-project/docker/blob/master/config/nginx.conf
#
# This configuration proxies to wger-static container which serves static files
# (mimicking the official setup's shared volumes approach)

upstream wger {
    server 10.0.2.2:8051;  # wger-web Django app
}

upstream wger_static {
    server 10.0.2.2:8052;  # wger-static nginx (serves static/media)
}

server {
    listen 1080;
    server_name wger.aevion.lan wger-web.aevion.lan;

    # Gzip compression for better performance.
    # NOTE: text/html is always gzipped by nginx and must NOT be listed here,
    # otherwise nginx warns "duplicate MIME type text/html" on every reload.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
    gzip_comp_level 6;

    # Increase max body size to allow for video uploads (official setting)
    client_max_body_size 100M;

    # Static files - proxied to dedicated wger-static nginx
    # (equivalent to official setup's: alias /wger/static/)
    location /static/ {
        proxy_pass http://wger_static/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Media files - proxied to dedicated wger-static nginx
    # (equivalent to official setup's: alias /wger/media/)
    location /media/ {
        proxy_pass http://wger_static/media/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Proxy all other requests to Django (official pattern)
    location / {
        proxy_pass http://wger;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_redirect off;
    }
}
