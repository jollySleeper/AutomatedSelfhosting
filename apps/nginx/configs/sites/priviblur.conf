# Priviblur - Tumblr Alternative Frontend
# https://github.com/syeopite/priviblur
#
# Key settings:
# - proxy_buffering off: Tumblr is image/GIF heavy
#   Media is proxied through Priviblur - disable buffering to reduce SSD wear

server {
    listen 1080;
    server_name priviblur.aevion.lan;

    set $UPSTREAM_IP 10.0.2.2;
    set $UPSTREAM_PORT 8010;

    include /etc/nginx/snippets/proxy-defaults.conf;

    location / {
        proxy_pass http://$UPSTREAM_IP:$UPSTREAM_PORT;

        # Disable buffering for Tumblr media (images, GIFs)
        proxy_buffering off;
    }
}

server {
    listen 1443 ssl;
    http2 on;
    server_name priviblur.aevion.lan;

    set $UPSTREAM_IP 10.0.2.2;
    set $UPSTREAM_PORT 8010;

    include /etc/nginx/snippets/proxy-defaults.conf;
    include /etc/nginx/snippets/self-signed.conf;
    include /etc/nginx/snippets/ssl-params.conf;

    location / {
        proxy_pass http://$UPSTREAM_IP:$UPSTREAM_PORT;

        # Disable buffering for Tumblr media
        proxy_buffering off;
    }
}
