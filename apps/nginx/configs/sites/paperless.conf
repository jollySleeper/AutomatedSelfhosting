# Paperless-ngx - Document Management System
# https://docs.paperless-ngx.com/
#
# proxy_buffering off: Web app with document upload/download.
# Large client_max_body_size to allow document uploads.

server {
    listen 1080;
    server_name paperless.aevion.lan docs.aevion.lan;

    set $UPSTREAM_IP 10.0.2.2;
    set $UPSTREAM_PORT 8033;

    client_max_body_size 100M;

    location / {
        proxy_pass http://$UPSTREAM_IP:$UPSTREAM_PORT;
        include /etc/nginx/snippets/proxy-defaults.conf;

        proxy_buffering off;
    }
}

server {
    listen 1443 ssl;
    http2 on;
    server_name paperless.aevion.lan docs.aevion.lan;

    set $UPSTREAM_IP 10.0.2.2;
    set $UPSTREAM_PORT 8033;

    client_max_body_size 100M;

    include /etc/nginx/snippets/self-signed.conf;
    include /etc/nginx/snippets/ssl-params.conf;

    location / {
        proxy_pass http://$UPSTREAM_IP:$UPSTREAM_PORT;
        include /etc/nginx/snippets/proxy-defaults.conf;

        proxy_buffering off;
    }
}
