# Sure — Personal Finance & Wealth Dashboard
# https://github.com/we-promise/sure
#
# proxy_buffering off: Rails web app with API responses and Sidekiq background jobs.

server {
    listen 1080;
    server_name sure.aevion.lan;

    set $UPSTREAM_IP 10.0.2.2;
    set $UPSTREAM_PORT 8056;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 1443 ssl;
    http2 on;
    server_name sure.aevion.lan;

    set $UPSTREAM_IP 10.0.2.2;
    set $UPSTREAM_PORT 8056;

    client_max_body_size 25M;

    include /etc/nginx/snippets/self-signed.conf;
    include /etc/nginx/snippets/ssl-params.conf;

    location / {
        proxy_pass http://$UPSTREAM_IP:$UPSTREAM_PORT;
        include /etc/nginx/snippets/proxy-defaults.conf;
        proxy_buffering off;
    }
}
