# Jellyfin Media Server - Reverse Proxy Configuration (v4)
# https://jellyfin.org/docs/general/post-install/networking/reverse-proxy/nginx
#
# v4 rationale (fixes three bugs in v3):
#   1. proxy_set_header inheritance: v3's location / defined Range/If-Range
#      at location level, which caused NGINX to drop ALL inherited headers
#      from the server-scope proxy-defaults.conf include (Host, X-Real-IP,
#      X-Forwarded-*, Upgrade, Connection). Fixed by including proxy-defaults
#      inside each location block instead of at server scope.
#   2. WebSocket timeout: v3's /socket had no proxy_read_timeout, defaulting
#      to 60s. NGINX dropped WebSocket connections after 60s idle. Fixed by
#      setting proxy_read_timeout 3600s on /socket.
#   3. Connection header: proxy-defaults.conf sent Connection: "Upgrade" on
#      all traffic (fixed globally in proxy-defaults.conf + nginx.conf map).
#
# Buffering strategy (carried over from v3):
#   proxy_buffering on with up to 256 MB temp-file spill. This decouples
#   the fast localhost upstream from slower Wi-Fi clients for both Direct
#   Play (large MKV) and HLS (small segments).

server {
    listen 1080;
    server_name jf.aevion.lan jellyfin.aevion.lan;

    set $UPSTREAM_IP 10.0.2.2;
    set $UPSTREAM_PORT 8041;

    client_max_body_size 20M;

    location / {
        proxy_pass http://$UPSTREAM_IP:$UPSTREAM_PORT;
        include /etc/nginx/snippets/proxy-defaults.conf;

        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        proxy_buffering on;
        proxy_buffers 64 16k;
        proxy_buffer_size 16k;
        proxy_busy_buffers_size 512k;
        proxy_max_temp_file_size 256m;
        proxy_temp_file_write_size 256k;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
    }

    location /socket {
        proxy_pass http://$UPSTREAM_IP:$UPSTREAM_PORT;
        include /etc/nginx/snippets/proxy-defaults.conf;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}

server {
    listen 1443 ssl;
    http2 on;
    server_name jf.aevion.lan jellyfin.aevion.lan;

    set $UPSTREAM_IP 10.0.2.2;
    set $UPSTREAM_PORT 8041;

    client_max_body_size 20M;

    include /etc/nginx/snippets/self-signed.conf;
    include /etc/nginx/snippets/ssl-params.conf;

    location / {
        proxy_pass http://$UPSTREAM_IP:$UPSTREAM_PORT;
        include /etc/nginx/snippets/proxy-defaults.conf;

        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        proxy_buffering on;
        proxy_buffers 64 16k;
        proxy_buffer_size 16k;
        proxy_busy_buffers_size 512k;
        proxy_max_temp_file_size 256m;
        proxy_temp_file_write_size 256k;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
    }

    location /socket {
        proxy_pass http://$UPSTREAM_IP:$UPSTREAM_PORT;
        include /etc/nginx/snippets/proxy-defaults.conf;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
