# Rimgo - Imgur Alternative Frontend
# https://codeberg.org/rimgo/rimgo
#
# Key settings:
# - proxy_buffering off: Imgur images/GIFs/videos are proxied through Rimgo
#   Without this, NGINX buffers media to disk before sending to client,
#   increasing SSD wear and adding latency
#   Imgur is particularly media-heavy (large images, long GIFs, videos)

server {
    listen 1080;
    server_name rimgo.aevion.lan;

    set $UPSTREAM_IP 10.0.2.2;
    set $UPSTREAM_PORT 8019;

    include /etc/nginx/snippets/proxy-defaults.conf;

    location / {
        proxy_pass http://$UPSTREAM_IP:$UPSTREAM_PORT;

        # Disable buffering for media streaming (images, GIFs, videos)
        # Imgur content is particularly large - this is important
        proxy_buffering off;
    }
}

server {
    listen 1443 ssl;
    http2 on;
    server_name rimgo.aevion.lan;

    set $UPSTREAM_IP 10.0.2.2;
    set $UPSTREAM_PORT 8019;

    include /etc/nginx/snippets/proxy-defaults.conf;
    include /etc/nginx/snippets/self-signed.conf;
    include /etc/nginx/snippets/ssl-params.conf;

    location / {
        proxy_pass http://$UPSTREAM_IP:$UPSTREAM_PORT;

        # Disable buffering for media streaming
        proxy_buffering off;
    }
}
