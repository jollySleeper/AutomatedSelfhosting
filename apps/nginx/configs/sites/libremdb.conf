# LibreMDB - IMDb Alternative Frontend
# https://github.com/zyachel/libremdb
#
# Key settings:
# - proxy_buffering off: Movie trailers and posters are proxied
#   Trailers can be large videos - disable buffering to reduce SSD wear

server {
    listen 1080;
    server_name imdb.aevion.lan libremdb.aevion.lan;

    set $UPSTREAM_IP 10.0.2.2;
    set $UPSTREAM_PORT 8015;

    include /etc/nginx/snippets/proxy-defaults.conf;

    location / {
        proxy_pass http://$UPSTREAM_IP:$UPSTREAM_PORT;

        # Disable buffering for movie trailers and media
        proxy_buffering off;
    }
}

server {
    listen 1443 ssl;
    http2 on;
    server_name imdb.aevion.lan libremdb.aevion.lan;

    set $UPSTREAM_IP 10.0.2.2;
    set $UPSTREAM_PORT 8015;

    include /etc/nginx/snippets/proxy-defaults.conf;
    include /etc/nginx/snippets/self-signed.conf;
    include /etc/nginx/snippets/ssl-params.conf;

    location / {
        proxy_pass http://$UPSTREAM_IP:$UPSTREAM_PORT;

        # Disable buffering for movie trailers and media
        proxy_buffering off;
    }
}
