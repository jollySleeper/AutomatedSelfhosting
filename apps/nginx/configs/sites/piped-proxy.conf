# Piped Proxy - Video streaming reverse proxy
# NOTE: proxy_buffering is OFF to prevent NGINX from buffering large video files to disk
# which causes severe streaming performance degradation

server {
    listen 1080;
    server_name piped-proxy.aevion.lan;

    set $UPSTREAM_IP 10.0.2.2;
    set $UPSTREAM_PORT 8023;

    include /etc/nginx/snippets/proxy-defaults.conf;

    location / {
        proxy_pass http://$UPSTREAM_IP:$UPSTREAM_PORT;

        # CRITICAL: Disable buffering for video streaming
        proxy_buffering off;
        proxy_request_buffering off;

        # Increase timeouts for large video files
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
    }
}

server {
    listen 1443 ssl;
    http2 on;
    server_name piped-proxy.aevion.lan;

    set $UPSTREAM_IP 10.0.2.2;
    set $UPSTREAM_PORT 8023;

    include /etc/nginx/snippets/proxy-defaults.conf;
    include /etc/nginx/snippets/self-signed.conf;
    include /etc/nginx/snippets/ssl-params.conf;

    location / {
        proxy_pass http://$UPSTREAM_IP:$UPSTREAM_PORT;

        # CRITICAL: Disable buffering for video streaming
        proxy_buffering off;
        proxy_request_buffering off;

        # Increase timeouts for large video files
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
    }
}
