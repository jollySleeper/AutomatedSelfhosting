# Default server block — catch-all for bare IP and unmatched hostnames.
#
# This handles every request whose Host header matches no other server_name
# (raw IP like https://192.168.1.105, the bare https://aevion.lan, typo'd
# subdomains, and scanner probes). It is intentionally QUIET: it returns a
# minimal branded 404 and never advertises which services run here.
#
# The friendly service directory lives on its own hostname instead
# (home.aevion.lan — see home.conf), so it is never exposed on bare IP.
#
# WHY THE FILENAME IS 000-default.conf:
# nginx includes conf.d/*.conf in alphabetical order, and the default server
# for a listen port is either (a) the block with the `default_server` flag, or
# (b) if none has it, the FIRST block loaded for that address:port. We set
# `default_server` explicitly below AND name the file 000-... so it always
# loads first. That way, even if a `default_server` flag were ever dropped by
# mistake, the quiet catch-all — not some random service — remains the fallback
# on BOTH :1080 (HTTP) and :1443 (HTTPS).

# ---- HTTP (port 1080) ----
server {
    listen 1080 default_server;
    server_name _;

    # ===== SECURITY HARDENING SNIPPETS =====
    # Unmatched / bare-IP traffic is the most likely to be scanners and bots,
    # so keep the full hardening stack applied here.
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/request-limits.conf;
    include /etc/nginx/snippets/rate-limiting.conf;
    include /etc/nginx/snippets/suspicious-detection.conf;
    include /etc/nginx/snippets/path-blocking.conf;

    # ===== HEALTH CHECK =====
    # Dedicated, minimal endpoint for the container health check
    # (HealthCmd in nginx.container hits http://127.0.0.1:1080/health).
    # Kept deliberately dumb — no version/uptime/stats (that's recon).
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ===== EVERYTHING ELSE =====
    # Minimal branded 404 from the mounted html dir (configs/html/404.html ->
    # /usr/share/nginx/html). No service list = no inventory disclosure.
    root /usr/share/nginx/html;
    error_page 404 /404.html;
    location = /404.html { internal; }
    location / { return 404; }
}

# ---- HTTPS (port 1443) ----
# Mirrors the HTTP block so bare https://aevion.lan / https://<ip> also hit the
# quiet catch-all instead of the first alphabetical SSL vhost. A TLS handshake
# needs a cert before the hostname is known, so the self-signed cert is used.
server {
    listen 1443 ssl default_server;
    http2 on;
    server_name _;

    include /etc/nginx/snippets/self-signed.conf;
    include /etc/nginx/snippets/ssl-params.conf;

    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/request-limits.conf;
    include /etc/nginx/snippets/rate-limiting.conf;
    include /etc/nginx/snippets/suspicious-detection.conf;
    include /etc/nginx/snippets/path-blocking.conf;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    root /usr/share/nginx/html;
    error_page 404 /404.html;
    location = /404.html { internal; }
    location / { return 404; }
}
