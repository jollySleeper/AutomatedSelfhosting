# Open WebUI - AI/LLM Web Interface
#
# Key settings:
# - proxy_buffering off: CRITICAL for LLM streaming (Server-Sent Events)
#   Without this, AI responses buffer and appear all at once instead of streaming
# - WebSocket support: For real-time chat functionality
# - Extended timeouts: LLM responses can take minutes for long generations

server {
    listen 1080;
    server_name ai.aevion.lan open-webui.aevion.lan;

    set $UPSTREAM_IP 10.0.2.2;
    set $UPSTREAM_PORT 8888;

    # Allow large file uploads (documents, images for vision models)
    client_max_body_size 50M;

    # Common proxy headers
    include /etc/nginx/snippets/proxy-defaults.conf;

    location / {
        proxy_pass http://$UPSTREAM_IP:$UPSTREAM_PORT;

        # CRITICAL: Disable buffering for LLM streaming (SSE)
        # Without this, the AI response buffers and appears all at once
        # instead of streaming word-by-word
        proxy_buffering off;

        # Extended timeouts for long LLM generations
        # Some complex prompts can take 2-5 minutes
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;
    }

    # WebSocket support (if used for real-time features)
    location /ws {
        proxy_pass http://$UPSTREAM_IP:$UPSTREAM_PORT;
        include /etc/nginx/snippets/proxy-defaults.conf;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Long timeout for persistent WebSocket connections
        proxy_read_timeout 86400s;
    }
}

server {
    listen 1443 ssl;
    http2 on;
    server_name ai.aevion.lan open-webui.aevion.lan;

    set $UPSTREAM_IP 10.0.2.2;
    set $UPSTREAM_PORT 8888;

    # Allow large file uploads
    client_max_body_size 50M;

    include /etc/nginx/snippets/proxy-defaults.conf;
    include /etc/nginx/snippets/self-signed.conf;
    include /etc/nginx/snippets/ssl-params.conf;

    location / {
        proxy_pass http://$UPSTREAM_IP:$UPSTREAM_PORT;

        # CRITICAL: Disable buffering for LLM streaming
        proxy_buffering off;

        # Extended timeouts for long LLM generations
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;
    }

    # WebSocket support
    location /ws {
        proxy_pass http://$UPSTREAM_IP:$UPSTREAM_PORT;
        include /etc/nginx/snippets/proxy-defaults.conf;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 86400s;
    }
}
