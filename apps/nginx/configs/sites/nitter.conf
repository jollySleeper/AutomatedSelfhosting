# Nitter - Twitter/X Alternative Frontend
# https://github.com/zedeus/nitter
#
# Key settings:
# - proxy_buffering off: Twitter videos/GIFs are proxied through Nitter
#   Without this, NGINX buffers media to disk before sending to client,
#   increasing SSD wear and adding latency

server {
    listen 1080;
    server_name nitter.aevion.lan;

    set $UPSTREAM_IP 10.0.2.2;
    set $UPSTREAM_PORT 8018;

    include /etc/nginx/snippets/proxy-defaults.conf;

    location / {
        proxy_pass http://$UPSTREAM_IP:$UPSTREAM_PORT;

        # Disable buffering for media streaming (videos, GIFs)
        # Reduces SSD wear and improves latency for media content
        proxy_buffering off;
    }
}

server {
    listen 1443 ssl;
    http2 on;
    server_name nitter.aevion.lan;

    set $UPSTREAM_IP 10.0.2.2;
    set $UPSTREAM_PORT 8018;

    include /etc/nginx/snippets/proxy-defaults.conf;
    include /etc/nginx/snippets/self-signed.conf;
    include /etc/nginx/snippets/ssl-params.conf;

    location / {
        proxy_pass http://$UPSTREAM_IP:$UPSTREAM_PORT;

        # Disable buffering for media streaming
        proxy_buffering off;
    }
}
