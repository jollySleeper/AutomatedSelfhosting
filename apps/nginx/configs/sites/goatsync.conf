# GoatSync - EteSync-compatible Calendar/Contacts Sync Server
# Based on deployment documentation:
# https://github.com/jollySleeper/GoatSync/blob/main/docs/DEPLOYMENT.md
#
# Key settings:
# - WebSocket support: Required for real-time sync notifications
# - proxy_buffering off: Reduces latency for sync operations

server {
    listen 1080;
    # NOTE: sync.aevion.lan intentionally belongs to Syncthing (syncthing.conf).
    # Do not add it here or nginx will drop one route as a conflicting server_name.
    server_name goatsync.aevion.lan;

    set $UPSTREAM_IP 10.0.2.2;
    set $UPSTREAM_PORT 8037;

    location / {
        proxy_pass http://$UPSTREAM_IP:$UPSTREAM_PORT;
        include /etc/nginx/snippets/proxy-defaults.conf;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
    }
}

server {
    listen 1443 ssl;
    http2 on;
    server_name goatsync.aevion.lan;

    set $UPSTREAM_IP 10.0.2.2;
    set $UPSTREAM_PORT 8037;

    include /etc/nginx/snippets/self-signed.conf;
    include /etc/nginx/snippets/ssl-params.conf;

    location / {
        proxy_pass http://$UPSTREAM_IP:$UPSTREAM_PORT;
        include /etc/nginx/snippets/proxy-defaults.conf;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
    }
}
