# Seerr - Media Request & Discovery Manager
# https://docs.seerr.dev/
#
# proxy_buffering off: Web app with API responses, no media streaming.
# client_max_body_size: Allow poster image uploads.

server {
    listen 1080;
    server_name seerr.aevion.lan;

    set $UPSTREAM_IP 10.0.2.2;
    set $UPSTREAM_PORT 8068;

    client_max_body_size 10M;

    location / {
        proxy_pass http://$UPSTREAM_IP:$UPSTREAM_PORT;
        include /etc/nginx/snippets/proxy-defaults.conf;

        proxy_buffering off;
    }
}

server {
    listen 1443 ssl;
    http2 on;
    server_name seerr.aevion.lan;

    set $UPSTREAM_IP 10.0.2.2;
    set $UPSTREAM_PORT 8068;

    client_max_body_size 10M;

    include /etc/nginx/snippets/self-signed.conf;
    include /etc/nginx/snippets/ssl-params.conf;

    location / {
        proxy_pass http://$UPSTREAM_IP:$UPSTREAM_PORT;
        include /etc/nginx/snippets/proxy-defaults.conf;

        proxy_buffering off;
    }
}
