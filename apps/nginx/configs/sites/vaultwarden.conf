# Vaultwarden - Bitwarden-compatible Password Manager
# https://github.com/dani-garcia/vaultwarden/wiki/Proxy-examples
#
# Key settings:
# - HTTPS only: the web vault needs a secure context for the Web Crypto API.
# - vault.aevion.lan must match DOMAIN in local.env. Passkeys and WebAuthn are
#   bound to that origin, so the aliases redirect instead of proxying.
# - WebSocket notifications (/notifications/hub) share the main port and rely
#   on the Upgrade/Connection headers from proxy-defaults.conf.
# - Vaultwarden sends its own CSP and security headers, and omits
#   X-Frame-Options on *connector.html so WebAuthn and Duo 2FA iframes work.
#   The proxied vhost therefore inlines the TLS settings from ssl-params.conf
#   without its add_header lines, and must not include security-headers.conf.
# - proxy_buffering off: API and sync traffic.

server {
    listen 1080;
    server_name vault.aevion.lan vw.aevion.lan vaultwarden.aevion.lan;

    return 301 https://vault.aevion.lan$request_uri;
}

server {
    listen 1443 ssl;
    http2 on;
    server_name vw.aevion.lan vaultwarden.aevion.lan;

    include /etc/nginx/snippets/self-signed.conf;
    include /etc/nginx/snippets/ssl-params.conf;

    return 301 https://vault.aevion.lan$request_uri;
}

server {
    listen 1443 ssl;
    http2 on;
    server_name vault.aevion.lan;

    set $UPSTREAM_IP 10.0.2.2;
    set $UPSTREAM_PORT 8035;

    # Attachments and Send files (upstream recommendation)
    client_max_body_size 525M;

    include /etc/nginx/snippets/self-signed.conf;

    # Keep in sync with ssl-params.conf, minus its add_header lines.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH";
    ssl_ecdh_curve secp384r1;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling off;
    ssl_stapling_verify off;

    location / {
        proxy_pass http://$UPSTREAM_IP:$UPSTREAM_PORT;
        include /etc/nginx/snippets/proxy-defaults.conf;

        proxy_buffering off;
    }
}
