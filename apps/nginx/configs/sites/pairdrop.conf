# PairDrop - Local Peer-to-Peer File Transfer (AirDrop Alternative)
# https://github.com/schlagmichdoch/PairDrop
#
# Key settings:
# - HTTP is the primary requested access mode; HTTPS remains available.
# - proxy_buffering off: Keeps WebSocket signaling low latency.
# - WebSocket support: Handled via proxy-defaults.conf ($connection_upgrade map).
# - File data uses direct WebRTC or the private Coturn relay, not NGINX.
# - X-Forwarded-For: Correctly set in proxy-defaults.conf for local peer auto-discovery

server {
    listen 1080;
    server_name pairdrop.aevion.lan pd.aevion.lan drop.aevion.lan;

    set $UPSTREAM_IP 10.0.2.2;
    set $UPSTREAM_PORT 8034;

    client_max_body_size 0;

    location / {
        proxy_pass http://$UPSTREAM_IP:$UPSTREAM_PORT;
        include /etc/nginx/snippets/proxy-defaults.conf;

        proxy_buffering off;
        proxy_connect_timeout 300s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
    listen 1443 ssl;
    http2 on;
    server_name pairdrop.aevion.lan pd.aevion.lan drop.aevion.lan;

    set $UPSTREAM_IP 10.0.2.2;
    set $UPSTREAM_PORT 8034;

    client_max_body_size 0;

    include /etc/nginx/snippets/self-signed.conf;
    include /etc/nginx/snippets/ssl-params.conf;

    location / {
        proxy_pass http://$UPSTREAM_IP:$UPSTREAM_PORT;
        include /etc/nginx/snippets/proxy-defaults.conf;

        proxy_buffering off;
        proxy_connect_timeout 300s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
