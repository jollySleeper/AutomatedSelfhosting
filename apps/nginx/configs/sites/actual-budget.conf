# Actual Budget - Personal Finance
# https://actualbudget.org/docs/
#
# proxy_buffering off: Web app with API responses and sync operations.

server {
    listen 1080;
    server_name budget.aevion.lan actual-budget.aevion.lan;

    set $UPSTREAM_IP 10.0.2.2;
    set $UPSTREAM_PORT 8055;
    client_max_body_size 50M;

    location / {
        proxy_pass http://$UPSTREAM_IP:$UPSTREAM_PORT;
        include /etc/nginx/snippets/proxy-defaults.conf;
        proxy_buffering off;
    }
}

server {
    listen 1443 ssl;
    http2 on;
    server_name budget.aevion.lan actual-budget.aevion.lan;

    set $UPSTREAM_IP 10.0.2.2;
    set $UPSTREAM_PORT 8055;

    client_max_body_size 50M;

    include /etc/nginx/snippets/self-signed.conf;
    include /etc/nginx/snippets/ssl-params.conf;

    location / {
        proxy_pass http://$UPSTREAM_IP:$UPSTREAM_PORT;
        include /etc/nginx/snippets/proxy-defaults.conf;

        # Actual requires cross-origin isolation headers for SharedArrayBuffer.
        # Hide upstream values and set one canonical value to avoid duplicates.
        proxy_hide_header Cross-Origin-Embedder-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Origin-Agent-Cluster;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Origin-Agent-Cluster "?1" always;

        proxy_buffering off;
    }
}
