# Dashboard / service directory — home.aevion.lan
#
# Serves the static landing page (configs/html/index.html) that lists every
# service. It lives on its OWN hostname rather than the default server, so the
# inventory is never revealed to bare-IP or scanner traffic (see default.conf).
#
# DNS: add an AdGuard Home rewrite for home.aevion.lan -> the server's LAN IP,
# the same way the other *.aevion.lan hostnames are handled.

# HTTP -> HTTPS redirect. Use $host (not $server_name) so the redirect keeps
# whatever hostname the client actually requested.
server {
    listen 1080;
    server_name home.aevion.lan;

    return 307 https://$host$request_uri;
}

server {
    listen 1443 ssl;
    http2 on;
    server_name home.aevion.lan;

    include /etc/nginx/snippets/self-signed.conf;
    include /etc/nginx/snippets/ssl-params.conf;
    include /etc/nginx/snippets/security-headers.conf;

    # Static landing page mounted at configs/html -> /usr/share/nginx/html (ro).
    root /usr/share/nginx/html;
    index index.html;

    # ===== OPTIONAL: HTTP Basic Auth (currently DISABLED) =====
    # Basic Auth is the built-in nginx auth scheme: the browser shows a native
    # username/password prompt and nginx checks it against a hashed password
    # file. Credentials are only base64-encoded, so it is only safe over this
    # HTTPS (1443) block — never enable it on a plain-HTTP server.
    #
    # To turn it ON:
    #   1. Create the password file ON THE SERVER (never commit it):
    #        htpasswd -c ~/selfhost/apps/nginx/configs/.htpasswd <username>
    #      (no apache2-utils? use:
    #        printf '<username>:%s\n' "$(openssl passwd -apr1)" \
    #          > ~/selfhost/apps/nginx/configs/.htpasswd )
    #   2. Uncomment the .htpasswd volume mount in nginx.container
    #      (and podman-setup.sh) and recreate the container.
    #   3. Uncomment the two directives below and reload nginx.
    # NOTE: configs/.htpasswd is gitignored so the hash is never committed.
    #auth_basic "aevion dashboard";
    #auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
