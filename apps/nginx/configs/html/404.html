<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>404 — Not Found</title>
    <style>
        /* Light theme by default; dark values applied when the browser prefers dark. */
        :root {
            --bg: #f4f6fb;
            --heading: #1e293b;
            --muted: #64748b;
            --accent: #4460e0;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f1117;
                --heading: #f0f4ff;
                --muted: #718096;
                --accent: #5a7fff;
            }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--heading);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .box {
            text-align: center;
            max-width: 420px;
        }
        .code {
            font-size: 5rem;
            font-weight: 800;
            color: var(--accent);
            letter-spacing: -2px;
            line-height: 1;
        }
        h1 {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--heading);
            margin-top: 1rem;
        }
        p {
            color: var(--muted);
            margin-top: 0.6rem;
            font-size: 0.9rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="code">404</div>
        <h1>Not Found</h1>
        <p>No service is configured for this address. Check the hostname and try again.</p>
    </div>
</body>
</html>
