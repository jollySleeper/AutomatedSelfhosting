# The port to Listen on.
PORT: 8080

# The number of workers to use for the server
HTTP_WORKERS: 2

# Proxy
PROXY_PART: {{.piped-proxy-url}}
# Image proxy (defaults to PROXY_PART if unset)
#IMAGE_PROXY_PART: {{.piped-proxy-url}}
# Proxy hash secret for signed proxy URLs
#PROXY_HASH_SECRET:

# Outgoing HTTP Proxy - eg: 127.0.0.1:8118
#REQWEST_PROXY: 127.0.0.1:8118
#REQWEST_PROXY_USER:
#REQWEST_PROXY_PASS:

# Captcha Parameters
#CAPTCHA_BASE_URL: https://api.capmonster.cloud/
#CAPTCHA_API_KEY: INSERT_HERE

# Public API URL
API_URL: {{.piped-api-url}}

# PubSub callback URL (defaults to API_URL if unset)
#PUBSUB_URL: {{.piped-api-url}}
# PubSub Hub URL
#PUBSUB_HUB_URL: https://pubsubhubbub.appspot.com/subscribe

# Public Frontend URL
FRONTEND_URL: {{.piped-frontend-url}}

# Enable haveibeenpwned compromised password API
COMPROMISED_PASSWORD_CHECK: false

# Disable Registration
DISABLE_REGISTRATION: false

# Feed Retention Time in Days
FEED_RETENTION: 30

# Disable all background timers
#DISABLE_TIMERS: false

# --- Feed Refresh (upstream PR #889) ---
# Disable PubSub (WebSub) push notifications from YouTube
# Set to true if your instance is behind a firewall and can't receive webhooks
#DISABLE_PUBSUB: false

# Enable periodic background channel refresh as an alternative to PubSub
# WARNING: Only enable for self-hosted private instances with few users/channels
# Large instances will get rate limited/banned by YouTube
#FEED_REFRESH: false

# How many minutes to spread all channel refreshes over (evenly spaced)
# Lower values = fresher feeds but more API calls to YouTube
# Higher values = fewer API calls but potentially stale feeds
# 360 = 6 hours, 720 = 12 hours
#FEED_REFRESH_MINUTES: 15

# --- Return YouTube Dislike ---
#RYD_PROXY_URL: https://ryd-proxy.kavin.rocks
#DISABLE_RYD: false

# --- SponsorBlock ---
#SPONSORBLOCK_SERVERS: https://sponsor.ajay.app,https://sponsorblock.kavin.rocks

# --- LBRY / Odysee ---
#DISABLE_LBRY: false

# Subscription expiry in days (inactive subscriptions cleaned up after this)
#SUBSCRIPTIONS_EXPIRY: 30

# YouTube consent cookie (set to true to accept YouTube's consent)
#CONSENT_COOKIE: true

# YouTube country code for content localization
#YOUTUBE_COUNTRY:

# Disable the HTTP server (useful for feed-refresh-only workers)
#DISABLE_SERVER: false

# --- Sentry Error Tracking ---
#SENTRY_DSN:

# --- S3 Storage ---
#S3_ENDPOINT:
#S3_ACCESS_KEY:
#S3_SECRET_KEY:
#S3_BUCKET:

# --- Matrix Notifications ---
#MATRIX_SERVER: https://matrix-client.matrix.org
#MATRIX_TOKEN:

# --- Geo Restriction ---
#GEO_RESTRICTION_CHECKER_URL:

# BG Helper URL for supplying PoTokens
# Used to bypass YouTube's bot detection
# See: https://github.com/TeamPiped/bg-helper-server
#BG_HELPER_URL: http://{{.bg-helper-host}}:3000

# Hibernate properties
hibernate.connection.url: jdbc:postgresql://{{.postgresql-host}}:5432/{{.postgresql-db}}
hibernate.connection.driver_class: org.postgresql.Driver
hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
hibernate.connection.username: {{.postgresql-db-username}}
hibernate.connection.password: {{.postgresql-db-password}}
