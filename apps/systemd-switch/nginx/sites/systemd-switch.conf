server {
    listen 1080;
    server_name sysdwitch.aevion.lan control.aevion.lan systemd-switch.aevion.lan service-control.aevion.lan;

    set $UPSTREAM_IP 127.0.0.1;
    set $UPSTREAM_PORT 8081;

    include /etc/nginx/snippets/proxy-defaults.conf;

    location / {
        proxy_pass http://$UPSTREAM_IP:$UPSTREAM_PORT;
    }
}
